services:
  postgres:
    image: postgres:16-alpine
    container_name: ganabol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ganabol
      POSTGRES_PASSWORD: ganabol_dev
      POSTGRES_DB: ganabol
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ganabol -d ganabol"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
